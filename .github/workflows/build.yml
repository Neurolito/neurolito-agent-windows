name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Tharga.Neurolito.Windows.slnx -c Release
      - run: dotnet test Tharga.Neurolito.Windows.slnx -c Release --no-build
